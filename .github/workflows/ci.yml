name: CI

on:
  push:
    branches: [main, movil]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # No hay `build`: una app de Expo no compila en CI sin EAS. Lo que sí se puede
      # verificar aquí son los tipos y la lógica pura, que es donde vive el producto.
      - name: Tipos
        run: npx tsc --noEmit

      - name: Pruebas
        run: npm test

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install

      - name: Tipos del Worker
        run: npx tsc --noEmit
